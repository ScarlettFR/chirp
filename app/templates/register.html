{% extends "base.html" %}
{% block title %}регистрация · chirp{% endblock %}
{% block main %}
  <div class="max-w-sm mx-auto bg-slate-800/50 rounded-xl p-6">
    <h1 class="text-xl font-semibold mb-4">регистрация</h1>
    {% if err %}
      <div class="mb-3 bg-red-500/10 text-red-400 text-sm rounded-md px-3 py-2">{{ err }}</div>
    {% endif %}
    <form method="post" action="/register" class="space-y-3">
      <input name="username" required autocomplete="username"
             class="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 outline-none focus:border-sky-500"
             placeholder="имя (3–32, буквы/цифры/_)">
      <input name="password" type="password" required minlength="6" autocomplete="new-password"
             class="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 outline-none focus:border-sky-500"
             placeholder="пароль (≥6)">
      <button class="w-full bg-sky-500 hover:bg-sky-400 rounded-full py-2 text-sm font-semibold">создать</button>
    </form>
    <p class="mt-4 text-sm text-slate-400 text-center">
      уже есть? <a href="/login" class="text-sky-400 hover:underline">войти</a>
    </p>
  </div>
{% endblock %}
