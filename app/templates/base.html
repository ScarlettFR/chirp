<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}chirp{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.2"></script>
  <link rel="icon" href="data:,">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased">
  <header class="border-b border-slate-800 sticky top-0 bg-slate-900/80 backdrop-blur z-10">
    <div class="max-w-2xl mx-auto flex items-center justify-between px-4 py-3">
      <a href="/" class="font-bold text-xl text-sky-400">chirp</a>
      <nav class="flex items-center gap-3 text-sm">
        {% if me %}
          <a href="/@{{ me.username }}" class="text-slate-300 hover:text-white">@{{ me.username }}</a>
          <form method="post" action="/logout" class="inline">
            <button class="text-slate-400 hover:text-white">выйти</button>
          </form>
        {% else %}
          <a href="/login" class="text-slate-300 hover:text-white">войти</a>
          <a href="/register" class="bg-sky-500 hover:bg-sky-400 px-3 py-1.5 rounded-full text-white">начать</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6">
    {% block main %}{% endblock %}
  </main>
</body>
</html>
